# Cilium BGP configuration for worker nodes.
# Workers peer via iBGP (AS 64512) with the FRR Route Reflector on
# control-plane-1 and advertise their pod CIDRs.
---
apiVersion: cilium.io/v2
kind: CiliumBGPClusterConfig
metadata:
  name: bgp-cluster
spec:
  nodeSelector:
    matchLabels:
      bgp-policy: worker
  bgpInstances:
    - name: worker-bgp
      localASN: 64512
      peers:
        - name: route-reflector
          peerASN: 64512
          peerAddress: fd00:100::10
          peerConfigRef:
            name: rr-peer
---
apiVersion: cilium.io/v2
kind: CiliumBGPPeerConfig
metadata:
  name: rr-peer
spec:
  # A family sends only the CiliumBGPAdvertisements its selector matches; with no selector
  # the session comes up but advertises nothing.
  families:
    - afi: ipv4
      safi: unicast
      advertisements:
        matchLabels:
          advertise: bgp
    - afi: ipv6
      safi: unicast
      advertisements:
        matchLabels:
          advertise: bgp
  gracefulRestart:
    enabled: true
    restartTimeSeconds: 120
---
apiVersion: cilium.io/v2
kind: CiliumBGPAdvertisement
metadata:
  name: pod-cidrs
  labels:
    advertise: bgp
spec:
  advertisements:
    - advertisementType: PodCIDR
