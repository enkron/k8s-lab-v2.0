[global]
exclude = [
    ".git",
    ".jj",
    "cloud-init",
    "disks",
    "images",
    "Makefile",
    # Historical document, kept as written at migration time.
    "docs/talos-migration-plan.md",
]

# Respect .gitignore files when scanning directories
respect-gitignore = true

# Markdown flavor/dialect
# Options: standard, gfm, commonmark, mkdocs, mdx, quarto
flavor = "standard"

# Rule-specific configurations
#
# Bold text is used deliberately as sub-step labels in the implementation plan.
[MD036]
enabled = false

[MD033]
allowed-elements = ["br"]

# Require a blank line between the list item and any following unindented text
#
# ```
# 1. List item
#    Some text that continues the list item.
# ```
[MD032]
allow-lazy-continuation = false

[MD013]
code-blocks = false
line-length = 80
reflow = true
reflow-mode = "default"
