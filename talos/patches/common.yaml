machine:
  # Talos API TLS certificate must include 127.0.0.1 and localhost because
  # talosctl connects through QEMU SLIRP port forwarding (host:50000 -> VM:50000).
  certSANs:
    - 127.0.0.1
    - localhost
  kernel:
    modules:
      - name: br_netfilter
  sysctls:
    net.ipv4.ip_forward: "1"
    net.ipv6.conf.all.forwarding: "1"
    net.bridge.bridge-nf-call-iptables: "1"
    net.bridge.bridge-nf-call-ip6tables: "1"
  kubelet:
    nodeIP:
      # Force kubelet to register with addresses from the internal VDE network.
      # Without this, kubelet picks the SLIRP management IP (192.168.100.x) which
      # is per-VM isolated NAT — unreachable from other VMs. The internal network
      # is a shared L2 segment where all VMs can communicate.
      # IPv6 listed first → primary InternalIP is IPv6 (dual-stack, IPv6-primary).
      # IPv4 (10.100.0.0/24) is required for Cilium's datapath — it needs an IPv4
      # address on the routing device even in native routing mode.
      validSubnets:
        - fd00:100::/64
        - 10.100.0.0/24
  time:
    servers:
      - time.cloudflare.com
cluster:
  network:
    # Cilium is installed separately via Helm (make cilium-install).
    cni:
      name: none
    # IPv6-first dual-stack: the primary (first) family must match the API
    # server's advertise address family. Since CLUSTER_ENDPOINT is IPv6
    # (https://[fd00:100::10]:6443), IPv6 subnets come first.
    podSubnets:
      - fd00:244::/48
      - 10.244.0.0/16
    serviceSubnets:
      - fd00:96::/112
      - 10.96.0.0/16
  proxy:
    # Cilium replaces kube-proxy with eBPF-based service routing.
    disabled: true
